<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07090F">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon-64.png">
<title>Reset your password — JD Esports Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090F;--bg-2:#0D111B;--panel-2:#151D2E;--line:rgba(255,200,80,.14);
  --gold:#FFC83D;--gold-2:#FFAE00;--gold-l:#FFDD85;--gold-m:rgba(255,200,80,.42);
  --cream:#FFFFFF;--silver:#A6AFC2;--body:#8A94A8;--green:#5aab8a;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--cream);font-family:'Inter',sans-serif;font-weight:400;line-height:1.6;display:flex;align-items:center;justify-content:center;padding:24px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(1200px 600px at 70% -10%,rgba(255,200,61,.10),transparent 60%),radial-gradient(900px 500px at 10% 110%,rgba(255,174,0,.10),transparent 60%);pointer-events:none;z-index:0}
a{color:inherit}
.card{position:relative;z-index:1;background:var(--panel-2);border:1px solid var(--line);border-radius:18px;padding:32px 28px;width:min(400px,100%);box-shadow:0 18px 54px rgba(0,0,0,.55)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.jdlogo{width:36px;height:36px;border-radius:10px;object-fit:cover;display:block;flex:none}
.brand b{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:.03em;text-transform:uppercase}
.brand span{display:block;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-l)}
h1{font-family:'Bebas Neue',sans-serif;text-transform:uppercase;letter-spacing:.02em;font-size:1.5rem;margin:0 0 6px}
.sub{color:var(--body);font-size:.86rem;margin:0 0 20px}
label{display:block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--silver);margin:14px 0 5px}
input{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:9px;padding:11px 12px;color:var(--cream);font-family:inherit;font-size:.92rem;outline:none}
input:focus{border-color:var(--gold)}
.btn-primary{width:100%;margin-top:20px;padding:13px;border:none;border-radius:999px;background:linear-gradient(100deg,var(--gold),var(--gold-2));color:#07090F;font-weight:700;font-size:.94rem;letter-spacing:.02em;cursor:pointer;font-family:inherit;transition:.2s}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(255,190,50,.3)}
.btn-primary:disabled{opacity:.6;cursor:default;transform:none;box-shadow:none}
.msg{font-size:.82rem;min-height:18px;margin-top:12px}
.msg.ok{color:var(--green)}
.msg.err{color:#ff7676}
.back{display:inline-block;margin-top:18px;font-size:.82rem;color:var(--gold-l);text-decoration:underline}
.spinner{width:20px;height:20px;border:2px solid var(--gold-m);border-top-color:var(--gold);border-radius:50%;margin:8px auto 0;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.center{text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <img class="jdlogo" src="/logo.png" alt="JD Esports Arena" width="36" height="36">
    <span><b>JD Esports Arena</b><span>by AyerFire</span></span>
  </div>
  <div id="rp-body">
    <h1>Reset your password</h1>
    <p class="sub">Verifying your reset link…</p>
    <div class="spinner"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://cnoxvqvpmgowdiyrrusv.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_5n7uzH5crKrLe8A75K6OVQ_C_di-jil';
const sb=(typeof supabase!=='undefined')?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const body=document.getElementById('rp-body');

function showForm(){
  body.innerHTML=`<h1>Reset your password</h1><p class="sub">Choose a new password for your account.</p><label>New password</label><input id="rp-pass" type="password" placeholder="At least 6 characters" autofocus><label>Confirm password</label><input id="rp-pass2" type="password" placeholder="Re-enter password"><div class="msg" id="rp-msg"></div><button class="btn-primary" id="rp-btn" onclick="submitNewPassword()">Save password</button>`;
  document.getElementById('rp-pass2').addEventListener('keydown',e=>{if(e.key==='Enter')submitNewPassword();});
}

function showError(text){
  body.innerHTML=`<h1>Link invalid or expired</h1><p class="sub">${text}</p><a class="back" href="/">Back to JD Esports Arena — request a new reset link from the account menu.</a>`;
}

function showSuccess(){
  body.innerHTML=`<h1>Password updated</h1><p class="sub ok" style="color:var(--green)">You're all set — you can log in with your new password.</p><a class="back" href="/">Continue to JD Esports Arena</a>`;
}

async function submitNewPassword(){
  const p=document.getElementById('rp-pass').value;
  const p2=document.getElementById('rp-pass2').value;
  const msg=document.getElementById('rp-msg');
  const btn=document.getElementById('rp-btn');
  if(p.length<6){msg.textContent='At least 6 characters.';msg.className='msg err';return;}
  if(p!==p2){msg.textContent="Passwords don't match.";msg.className='msg err';return;}
  btn.disabled=true;
  msg.textContent='Saving…';msg.className='msg';
  const {error}=await sb.auth.updateUser({password:p});
  btn.disabled=false;
  if(error){msg.textContent=error.message;msg.className='msg err';return;}
  showSuccess();
}

if(!sb){
  showError('Something went wrong loading this page. Please try the reset link again.');
}else{
  // Supabase Auth error redirects here as ?error=...&error_description=... (or in the hash).
  const errParams=new URLSearchParams(location.search.slice(1)+'&'+location.hash.slice(1));
  if(errParams.get('error')){
    showError(errParams.get('error_description')||'This link is no longer valid.');
  }else{
    let resolved=false;
    sb.auth.onAuthStateChange((event)=>{
      if(event==='PASSWORD_RECOVERY'){resolved=true;showForm();}
    });
    // Fallback: if the recovery session was already established before the listener
    // attached, detect it directly instead of waiting on an event that already fired.
    sb.auth.getSession().then(({data:{session}})=>{
      if(!resolved&&session){resolved=true;showForm();}
      else if(!resolved){
        setTimeout(()=>{if(!resolved)showError('This link is no longer valid — reset links expire after a while and can only be used once.');},2500);
      }
    });
  }
}
</script>
</body>
</html>
