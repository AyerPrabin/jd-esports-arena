<style>
:root{
  --bg:#07090F;--panel:#111827;--line:rgba(255,200,80,.14);
  --gold:#FFC83D;--gold-2:#FFAE00;--gold-l:#FFDD85;--gold-m:rgba(255,200,80,.42);
  --cream:#FFFFFF;--silver:#A6AFC2;--body:#8A94A8;
  --container:900px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font-family:var(--font-body);line-height:1.6}
a{color:inherit;text-decoration:none}
header{padding:20px var(--gutter);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;max-width:var(--container);margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}
.jdlogo{width:36px;height:36px;border-radius:8px;object-fit:cover;flex:none;display:block}
.brand span{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.3rem;letter-spacing:.02em;display:block}
.brand span span{font-family:var(--font-body);font-size:.68rem;font-weight:500;color:var(--gold-l);letter-spacing:.01em}
.back-btn{border:1px solid var(--gold-m);color:var(--gold-l);border-radius:30px;padding:8px 16px;font-size:.8rem;font-weight:600}
.back-btn:hover{background:rgba(255,200,61,.12)}
main{max-width:var(--container);margin:0 auto;padding:40px 0 80px}
footer{padding:30px 28px 50px;text-align:center;color:var(--body);font-size:.8rem}
.next{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap}
/* every event: sort bar + rows built on the same card as past events (.pe-card) */
.ev-bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0;margin-bottom:6px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.ev-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.ev-seg button{border:0;background:none;color:var(--silver);font:700 1.08rem var(--font-display);padding:8px 4px;border-radius:999px;cursor:pointer}
.ev-seg button[aria-pressed=true]{background:linear-gradient(100deg,var(--gold),var(--gold-2));color:#07090F}
.ev-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}
.ev-chips::-webkit-scrollbar{display:none}
.ev-chips button{flex:none;border:1px solid var(--line);background:none;color:var(--silver);font:500 .8rem var(--font-body);padding:6px 12px;border-radius:999px;cursor:pointer}
.ev-chips button[aria-pressed=true]{border-color:var(--gold-m);color:var(--gold-l);background:rgba(255,200,61,.12)}
.ev-group{margin-top:20px;display:grid;gap:10px}
.ev-group h2{font:700 1.45rem/1.1 var(--font-display);margin:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;text-wrap:balance}
.ev-group h2 small{font:400 .82rem var(--font-body);color:var(--silver)}
.ev-group h2.now{color:var(--gold-l)}
.ev{border-radius:16px;background:var(--panel);border:1px solid var(--line);padding:10px 12px;display:grid;gap:10px}
.ev:hover{border-color:var(--gold-m)}
.ev.joined{border-color:rgba(98,211,148,.45)}
.ev-top{all:unset;box-sizing:border-box;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;cursor:pointer;width:100%}
.ev-top:focus-visible,.ev-act:focus-visible,.ev-seg button:focus-visible,.ev-chips button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ev-top .pe-img{width:64px;height:64px}
.ev-name{display:block;font:700 1.18rem/1.12 var(--font-display);overflow-wrap:anywhere}
.ev-meta{display:flex;flex-wrap:wrap;align-items:center;gap:3px 10px;margin-top:4px;font-size:.8rem;color:var(--silver)}
.ev-org{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--gold-l);min-width:0;overflow-wrap:anywhere}
.ev-org img,.ev-org i{width:16px;height:16px;border-radius:50%;flex:none}
.ev-org.host{color:#CFE0FF}
.ev-org i{font-style:normal;display:grid;place-items:center;background:#2B3B63;font-size:.58rem;color:#CFE0FF}
.ev-live{color:#ff7676;font-weight:700}
.ev-prize{text-align:right;font:700 1.55rem/1 var(--font-display);color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}
.ev-prize.big{font-size:2rem}
.ev-prize small{display:block;font:500 .7rem var(--font-body);color:var(--silver)}
.ev-prize small:first-child{margin-bottom:3px}
.ev-prize small:last-child{margin-top:3px}
.ev-low{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.ev-seats{font-size:.76rem;color:var(--silver);font-variant-numeric:tabular-nums}
.ev-seats .full{color:#ff9a9a;font-weight:600}
.ev-seats .hot{color:var(--gold-l);font-weight:600}
.ev-track{display:block;height:5px;margin-bottom:4px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.ev-track i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2))}
.ev-act{display:inline-block;text-align:center;min-width:104px;padding:9px 18px;border-radius:999px;background:linear-gradient(100deg,var(--gold),var(--gold-2));color:#07090F;font-weight:700;font-size:.86rem}
.ev-act.alt{background:none;border:1px solid var(--gold-m);color:var(--gold-l)}
.ev-act.ok{background:none;border:1px solid rgba(98,211,148,.6);color:#62D394}
.ev-act.off{background:rgba(255,255,255,.06);color:var(--silver)}
.ev-more{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:10px}
.ev-more[hidden],.ev-seg[hidden]{display:none}
.ev-thumb{position:relative;display:block}
.ev-badge{position:absolute;top:-5px;left:-5px;z-index:1;width:24px;height:24px;border-radius:50%;background:#07090F;border:1.5px solid var(--gold);display:grid;place-items:center;overflow:hidden;font:700 .8rem var(--font-display);font-style:normal;color:var(--gold)}
.ev-badge img{width:18px;height:18px;object-fit:contain;display:block}
.ev-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:0}
.ev-facts div{min-width:0}
.ev-facts dt{font-size:.72rem;color:var(--silver)}
.ev-facts dd{margin:0;font-size:.88rem;font-weight:500;overflow-wrap:anywhere}
.ev-note{margin:0;font-size:.82rem;color:var(--silver)}
.ev-note b{color:var(--gold-l);font-weight:600}
/* best of 3: the three maps as mini tiles in place of the single map picture */
.pe-img.pe-maps{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;overflow:hidden;background:#0d1320;filter:none}
.pe-maps i{position:relative;background-size:cover;background-position:center;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}
.pe-maps i.rnd{background:repeating-linear-gradient(135deg,#1a2233 0 6px,#151c2b 6px 12px);align-items:center;padding:0;font-style:normal;font-size:.9rem}
.pe-win.hw{color:#FFB15C;background:linear-gradient(90deg,rgba(90,30,140,.35),rgba(255,122,28,.18));border-color:rgba(255,122,28,.55);box-shadow:0 0 14px rgba(150,80,255,.35);text-shadow:0 0 8px rgba(255,122,28,.6)}
.pe-maps b{font-size:.55rem;font-weight:800;color:#111;background:#FFC83D;border-radius:3px;padding:0 3px;line-height:1.4}
/* drawn icons instead of phone emoji: the same on every phone, in the page's own colours */
.ic{width:1.05em;height:1.05em;vertical-align:-.16em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pe-meta .ic{color:var(--gold);margin-right:3px}
.ev-seats .hot .ic{margin-right:3px}
.next .ev-link{display:inline-flex;align-items:center;gap:7px}
/* the next event to play, on its own map art */
.ev-hero{position:relative;margin-top:18px;border-radius:22px;overflow:hidden;min-height:250px;display:grid;align-content:end;gap:12px;padding:20px 18px 16px;
  background:#0d1320 center 35%/cover no-repeat;border:1px solid var(--gold-m);isolation:isolate}
.ev-hero::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(7,9,15,.05) 0%,rgba(7,9,15,.5) 42%,rgba(7,9,15,.95) 78%)}
.ev-hero .k{display:inline-flex;align-items:center;gap:6px;justify-self:start;font:600 .78rem var(--font-body);color:#07090F;background:var(--gold);border-radius:999px;padding:3px 11px}
.ev-hero h2{margin:0;font:700 clamp(1.8rem,7vw,2.6rem)/.98 var(--font-display);overflow-wrap:anywhere;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.ev-hero .when{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.88rem;color:#E4E8F2}
.ev-hero .when span{display:inline-flex;align-items:center;gap:6px}
.ev-hero .when .ic{color:var(--gold)}
.ev-hero .money{display:grid;grid-template-columns:1fr 1fr;gap:1px;border-radius:14px;overflow:hidden;background:var(--line)}
.ev-hero .money div{background:rgba(7,9,15,.82);padding:9px 12px}
.ev-hero .money dt{font-size:.72rem;color:var(--silver)}
.ev-hero .money dd{margin:0;font:700 1.5rem/1.05 var(--font-display);color:var(--gold);font-variant-numeric:tabular-nums}
.ev-hero .money div+div dd{color:var(--cream);font-size:1.15rem;padding-top:5px}
.ev-hero .ev-low .ev-seats{color:#D3D9E6}
@media (min-width:640px){.ev-hero{min-height:300px;padding:26px}}
.ev-rules{display:inline-flex;align-items:center;gap:8px;margin-top:10px;color:var(--gold-l,#ffd36b);font-weight:600;font-size:.92rem;text-decoration:none}.ev-rules:hover span{text-decoration:underline}
/* mode tiles: one per kind of game, on its own map with a character; tap = filter the list (Clash Squad opens Challenges) */
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 8px}
.mt-t{all:unset;box-sizing:border-box;position:relative;display:block;aspect-ratio:1/1.04;border-radius:18px;overflow:hidden;cursor:pointer;isolation:isolate;
  background:#0d1320 center/cover no-repeat;border:1px solid rgba(255,255,255,.09);transition:border-color .15s,transform .15s}
.mt-t::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(165deg,color-mix(in srgb,var(--c) 62%,transparent) 0%,rgba(7,9,15,.25) 48%,rgba(7,9,15,.94) 88%)}
.mt-c{position:absolute;z-index:-1;left:0;right:0;top:6%;bottom:24%;display:flex;justify-content:flex-end;align-items:flex-end;padding-right:2%}
.mt-c img{height:100%;width:auto;min-width:0;filter:drop-shadow(0 6px 10px rgba(0,0,0,.55))}
.mt-c img+img{margin-left:-17%}
.mt-c.n2 img{height:92%}.mt-c.n4 img{height:80%}.mt-c.n4 img+img{margin-left:-30%}
.mt-c.n2 img:first-child,.mt-c.n4 img:nth-child(odd){height:86%}
.mt-c.vs{justify-content:center;padding:0;gap:0}
.mt-c.vs .side{display:flex;align-items:flex-end;height:100%;flex:1;min-width:0;justify-content:center}
.mt-c.vs .side img+img{margin-left:-40%}
.mt-c.vs .side:last-child img{transform:scaleX(-1)}
.mt-x{flex:none;align-self:center;font:700 1.25rem/1 'Barlow Condensed',sans-serif;color:#07090F;background:var(--c);border-radius:8px;padding:4px 6px 3px;transform:skewX(-12deg);box-shadow:0 2px 12px rgba(0,0,0,.6);z-index:1}
.mt-n{position:absolute;left:10px;right:10px;bottom:30px;font:700 clamp(1.45rem,6.6vw,2.05rem)/.92 'Barlow Condensed',sans-serif;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.7);text-wrap:balance}
.mt-n::before{content:'';display:block;width:34px;height:4px;border-radius:2px;background:var(--c);margin-bottom:6px;transform:skewX(-20deg)}
.mt-f{position:absolute;left:10px;right:10px;bottom:9px;display:flex;justify-content:space-between;gap:6px;font-size:.72rem;color:#C9D0DE;white-space:nowrap}
.mt-f span:first-child{overflow:hidden;text-overflow:ellipsis}
.mt-f b{color:#62D394;font-weight:600;font-variant-numeric:tabular-nums}
.mt-f b::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#62D394;margin-right:5px;vertical-align:1px}
.mt-t:hover{border-color:color-mix(in srgb,var(--c) 70%,transparent)}
.mt-t[aria-pressed=true]{border:2px solid var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.mt-t:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mt-t:active{transform:scale(.98)}
@media (min-width:700px){.mt{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:reduce){.mt-t{transition:none}.mt-t:active{transform:none}}
</style>

<script>
/* Past events: finished/cancelled entries from tournaments.json (the newer of the Pages
   file and the live site_content copy, same rule as the homepage), plus any older event
   that only exists in the database now (get_arena_totals). Squads per event come from
   get_public_roster(). Nothing here needs a login. */
const TOURNAMENTS_URL='https://jdesport.co.uk/tournaments.json';
const sb=(typeof supabase!=='undefined')?supabase.createClient('https://cnoxvqvpmgowdiyrrusv.supabase.co','sb_publishable_5n7uzH5crKrLe8A75K6OVQ_C_di-jil'):null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pubTime=d=>(d&&Date.parse(d._published_at))||0;
const ICONS={cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
  map:'<path d="M9 4 3 6.5v14L9 18l6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v14M15 6.5v14"/>',
  crown:'<path d="M3 19h18M4 8l4.5 4L12 5l3.5 7L20 8l-1.8 8.5H5.8z"/>',
  flame:'<path d="M12 3c.5 3.5 5 5.4 5 10a5 5 0 0 1-10 0c0-2.6 1.4-4 2.4-5.6.4 1.6 1.2 2.6 2.4 3.1.6-2.4.6-4.9.2-7.5z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/>',
  star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const MAPS=['bermuda','purgatory','kalahari','alpine','nexterra','solara'];

function status(t){
  const s=String(t.status||'upcoming').toLowerCase();
  if(s!=='cancelled'&&String(t.winner||'').trim())return 'completed';
  return s;
}
function mapOf(t){const m=String(t.map||'').toLowerCase();return MAPS.find(x=>m.includes(x))||'bermuda';}
// best of 3 (from 28 Oct 2026): map / map2 / map3, each a map or 'random' (same fields as the homepage cards)
const MAP_NAME={bermuda:'Bermuda',purgatory:'Purgatory',kalahari:'Kalahari',alpine:'Alpine',nexterra:'NeXTerra',solara:'Solara'};
const isBo3=t=>!t.image&&(t.map2||t.map3);
const bo3Keys=t=>[t.map,t.map2,t.map3].map(k=>String(k||'random').toLowerCase());
function mapsHtml(t){
  return `<div class="pe-img pe-maps" aria-hidden="true">${bo3Keys(t).map((k,i)=>MAP_NAME[k]
    ?`<i style="background-image:url('/maps/thumb/ff-${k}.webp')"><b>M${i+1}</b></i>`:`<i class="rnd" title="Random">?</i>`).join('')}</div>`;
}
const mapsLine=t=>bo3Keys(t).map(k=>MAP_NAME[k]||'Random').join(' · ');
function fmtDate(t){
  if(t.date)return t.date;
  const ms=Date.parse(t.start);
  return isNaN(ms)?'':new Date(ms).toLocaleDateString([],{day:'numeric',month:'short',year:'numeric'});
}
/* site_content 'tournaments' is ~145 KB (squad logos): read only its updated_at (a few bytes) and download the
   content only when it changed, keeping the last copy on this device. Re-reading it every 15-30 s on every open
   page used up the whole Supabase data allowance (7 Nov 2026). */
async function jdLiveTournaments(sb){
  let at=null,doc=null;
  try{at=localStorage.getItem('jd_tour_at');doc=at?JSON.parse(localStorage.getItem('jd_tour_doc')||'null'):null;}catch(e){doc=null;}
  if(doc&&window.__jdTour&&window.__jdTour.at===at)doc=window.__jdTour.doc;   // same object between polls
  const h=await sb.from('site_content').select('updated_at').eq('key','tournaments').maybeSingle();
  if(h.error||!h.data)return doc;
  if(doc&&h.data.updated_at===at){window.__jdTour={at,doc};return doc;}
  const f=await sb.from('site_content').select('content,updated_at').eq('key','tournaments').maybeSingle();
  if(f.error||!f.data||!f.data.content)return doc;
  try{localStorage.setItem('jd_tour_doc',JSON.stringify(f.data.content));localStorage.setItem('jd_tour_at',f.data.updated_at);}catch(e){}
  window.__jdTour={at:f.data.updated_at,doc:f.data.content};
  return f.data.content;
}
async function getDoc(){
  const bust='v='+Math.floor(Date.now()/20000);
  const get=u=>fetch(u,{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject());
  const pages=get('/tournaments.json?'+bust).catch(()=>get(TOURNAMENTS_URL+'?'+bust)).catch(()=>null);

async function loadReviews(list){
  if(!sb)return;
  const {data:{session}}=await sb.auth.getSession().catch(()=>({data:{session:null}}));
  let mine=new Set();
  if(session){
    const {data}=await sb.from('registrations').select('tournament_slug,status').eq('player_id',session.user.id);
    (data||[]).filter(r=>r.status==='confirmed'||r.status==='approved').forEach(r=>mine.add(r.tournament_slug));
  }
  for(const el of list.querySelectorAll('[data-rev]')){
    const name=el.dataset.rev;
    const {data}=await sb.rpc('get_tournament_reviews',{p_tournament_slug:name});
    const rows=data||[];
    const avg=rows.length?rows.reduce((a,r)=>a+r.rating,0)/rows.length:0;
    el.innerHTML=(rows.length?`<div class="pe-rev-sum"><span class="pe-stars" aria-label="${avg.toFixed(1)} out of 5">${stars(avg)}</span> ${avg.toFixed(1)} · ${rows.length} review${rows.length===1?'':'s'}</div>`+
      rows.slice(0,5).map(r=>`<p class="pe-rev-item"><span class="pe-stars" aria-label="${r.rating} out of 5">${stars(r.rating)}</span> <b>@${esc(r.username||'player')}</b>${r.comment?' — '+esc(r.comment):''}</p>`).join(''):'')+
      (mine.has(name)?`<button type="button" class="pe-rate">${ic('star')} Rate this event</button>`:'');
    const b=el.querySelector('.pe-rate');

  }
}

  el.querySelector('.pe-rate').outerHTML=`<form class="pe-form"><fieldset><legend>Your rating</legend>${[1,2,3,4,5].map(n=>`<label><input type="radio" name="r" value="${n}"${n===5?' checked':''}> ${n}★</label>`).join('')}</fieldset><label for="c-${esc(name)}">Comment (optional)</label><textarea id="c-${esc(name)}" maxlength="500"></textarea><button type="submit">Submit review</button><p class="pe-msg" role="status"></p></form>`;

const chImg=c=>`<img src="/characters/${c}.webp" alt="" width="240" height="349" loading="lazy" decoding="async">`;
const chars=m=>m.vs?`<span class="mt-c vs"><span class="side">${ok(m.vs[0]).map(chImg).join('')}</span><span class="mt-x">VS</span><span class="side">${ok(m.vs[1]).map(chImg).join('')}</span></span>`
  :`<span class="mt-c n${ok(m.ch).length}">${ok(m.ch).map(chImg).join('')}</span>`;
const modeOf=t=>{const m=String(t.mode||'').toLowerCase();return m==='solo'||m==='duo'?m:'squad';};
const isFinal=t=>!!t.mega||['group','semi','final'].includes(t.stage);
const inMode=(t,k)=>k==='squad'||k==='duo'||k==='solo'?modeOf(t)===k:k==='final'?isFinal(t):k==='free'?!isPaid(t):k==='paid'?isPaid(t):true;
let csOpen=null,mtLast='';
function renderModes(up){
  const html=MODES.map(m=>{
    let n='';
    if(m.href)n=csOpen&&csOpen[m.k]?`<b>${csOpen[m.k]} open</b>`:'Play now';
    else{const it=up.filter(t=>inMode(t,m.k)),j=it.reduce((a,t)=>a+(evCounts.get(t.name)||0),0);
      n=j?`<b>${j} joined</b>`:it.length?it.length+' event'+(it.length===1?'':'s'):'Soon';}
    const inner=`${chars(m)}<span class="mt-n">${m.t}</span><span class="mt-f"><span>${m.s}</span>${n}</span>`;
    const st=`style="--c:${m.c};background-image:url('/maps/tile/ff-${m.map}.webp')"`;
    return m.href?`<a class="mt-t" href="${m.href}" ${st}>${inner}</a>`:`<button type="button" class="mt-t" data-k="${m.k}" aria-pressed="${evFilter===m.k}" ${st}>${inner}</button>`;
  }).join('');
  if(html!==mtLast){mtLast=html;document.getElementById('mt').innerHTML=html;}
}
function renderEvents(){
  const past=evFilter==='past';
  document.getElementById('ev-list').hidden=past;
  document.getElementById('pe-wrap').hidden=!past;
  document.getElementById('ev-seg').hidden=past;
  document.getElementById('ev-sub').textContent=past?TXT.pastsub:TXT.sub;
  if(past){if(!pastLoaded){pastLoaded=true;load().catch(()=>{document.getElementById('pe-list').innerHTML=`<div class="pe-empty">${TXT.err}</div>`;});}return;}
  if(!evDoc)return;
  const tms=t=>startMs(t)??Number.MAX_SAFE_INTEGER,byTime=(a,b)=>tms(a)-tms(b);
  const up=(evDoc.tournaments||[]).filter(t=>!['completed','cancelled'].includes(evStatus(t)));
  renderModes(up);
  const L=up.filter(t=>evFilter==='all'||(evFilter==='open'?!t.parent&&(!+t.slots||(evCounts.get(t.name)||0)<+t.slots):inMode(t,evFilter))).sort(byTime);
  let html='';
  // banner only on the plain list: the soonest event still to start that a player can join
  const top=evFilter==='all'&&evSort==='day'?L.find(t=>evStatus(t)==='upcoming'&&!t.parent&&!t.mega&&!earlyLocked(t)):null;
  if(top){html=hero(top);L.splice(L.indexOf(top),1);}
  if(!L.length){if(!top)html=`<div class="pe-empty" style="margin-top:16px">${up.length?TXT.none:TXT.noev}</div>`;}
  else if(evSort==='day'){
    const keys=[...new Set(L.map(t=>startMs(t)==null?'':dayKey(startMs(t))))];
    html+=keys.map(k=>{const it=L.filter(t=>(startMs(t)==null?'':dayKey(startMs(t)))===k),[a,b]=dayTitle(it[0]);return group(a,b,it,'day',a===TXT.tonight);}).join('');
  }else if(evSort==='prize'){
    html=group(TXT.biggest,'',L.slice().sort((a,b)=>prizeNum(b)-prizeNum(a)||byTime(a,b)),'prize');
  }else{
    const hosts=[...new Set(L.map(hostOf))].sort((a,b)=>a.localeCompare(b));   // '' (JD) sorts first
    html=hosts.map(h=>{const it=L.filter(t=>hostOf(t)===h);return group(h?'@'+h:'JD Esports',TXT.events(it.length),it,'host');}).join('');
  }
  if(html!==evLast){evLast=html;document.getElementById('ev-list').innerHTML=html;}
}
async function refreshEvents(){
  const [doc,roster,session]=await Promise.all([getDoc().catch(()=>null),sb?jdRoster(sb).then(r=>r.data||[],()=>null):null,sb?sb.auth.getSession().then(r=>r.data.session,()=>null):null]);
  if(doc)evDoc=doc;
  if(roster){const c=new Map();roster.forEach(r=>c.set(r.tournament_slug,(c.get(r.tournament_slug)||0)+1));evCounts=c;}
  if(session&&!csOpen){csOpen={};sb.rpc('get_open_challenges').then(({data})=>{(data||[]).forEach(c=>{csOpen[c.mode]=(csOpen[c.mode]||0)+1;});renderEvents();},()=>{});}
  if(session){const {data}=await sb.from('registrations').select('tournament_slug,status').eq('player_id',session.user.id);
    if(data)evMine=new Map(data.filter(r=>['confirmed','approved','pending','waitlisted'].includes(r.status)).map(r=>[r.tournament_slug,r.status]));}
  if(!evDoc){if(evFilter!=='past')document.getElementById('ev-list').innerHTML=`<div class="pe-empty">${TXT.err}</div>`;return;}
  renderEvents();
}
const press=(sel,attr,val)=>document.querySelectorAll(sel).forEach(x=>x.setAttribute('aria-pressed',x.dataset[attr]===val));
document.getElementById('ev-seg').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;evSort=b.dataset.s;press('[data-s]','s',evSort);renderEvents();});
document.getElementById('ev-chips').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;evFilter=b.dataset.f;press('[data-f]','f',evFilter);try{history.replaceState(null,'',evFilter==='past'?'#past':location.pathname);}catch(x){}renderEvents();});
document.getElementById('mt').addEventListener('click',e=>{
  const b=e.target.closest('[data-k]');if(!b)return;
  evFilter=evFilter===b.dataset.k?'all':b.dataset.k;press('[data-f]','f',evFilter);
  try{history.replaceState(null,'',location.pathname);}catch(x){}
  renderEvents();
  if(evFilter!=='all')document.querySelector('.ev-bar').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});
});
document.getElementById('ev-list').addEventListener('click',e=>{
  const top=e.target.closest('.ev-top');if(!top)return;
  const card=top.closest('.ev'),name=card.dataset.ev,more=card.querySelector('.ev-more'),o=more.hidden;
  more.hidden=!o;top.setAttribute('aria-expanded',o);
  if(o)evOpen.add(name);else evOpen.delete(name);
  evLast='';
});
if(location.hash==='#past'){evFilter='past';press('[data-f]','f','past');}
renderEvents();
refreshEvents();
setInterval(()=>{if(!document.hidden)refreshEvents();},30000);
</script>
