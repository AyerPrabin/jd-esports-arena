<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07090F">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon-64.png">
<title>Opening TikTok — JD Arena</title>
<style>
:root{--bg:#07090F;--ink:#F4F1E8;--dim:rgba(244,241,232,.65);--gold:#FFC83D}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
main{width:100%;max-width:360px}
h1{font-size:22px;margin:0 0 8px}
p{margin:0 0 20px;color:var(--dim)}
a{display:block;min-height:48px;padding:12px 16px;border-radius:12px;font-weight:700;text-decoration:none}
a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.go{background:var(--gold);color:#07090F;margin-bottom:10px}
.back{color:var(--ink);border:1px solid rgba(255,255,255,.18)}
</style>
</head>
<body>
<main>
  <h1>🎬 Opening TikTok…</h1>
  <p>If nothing happens, tap the button.</p>
  <a class="go" id="go" href="https://www.tiktok.com/@ayer_fire" rel="noopener noreferrer">Watch on TikTok</a>
  <a class="back" href="/">Back to JD Arena</a>
</main>
<script>
// Only our own account's videos: the id must be digits, so this page can't send anyone to another site.
(function(){
  var v=new URLSearchParams(location.search).get('v');
  var url='https://www.tiktok.com/@ayer_fire'+(/^[0-9]{6,25}$/.test(v||'')?'/video/'+v:'');
  document.getElementById('go').href=url;
  location.replace(url);
})();
</script>
</body>
</html>
