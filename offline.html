<h1>No internet connection</h1>
<p>JD Arena needs the internet for live slots, rooms and results. Check your Wi-Fi or mobile data.</p>
<div id="tickets"></div>
<button onclick="location.reload()">Try again</button>
</main>
<script>
addEventListener('online',()=>location.reload());
// the player's next tickets, saved on this device by the homepage (home.js saveOfflineTickets)
try{
  const d=JSON.parse(localStorage.getItem('jd_offline_tickets')||'null'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  if(d&&d.list&&d.list.length){
    document.getElementById('tickets').innerHTML='<p style="margin-bottom:10px">Your saved tickets (from '+esc(new Date(d.at).toLocaleString())+'):</p>'+d.list.map(t=>
      '<div class="tk"><small>'+esc(t.when||'')+'</small><b>'+esc(t.event)+'</b><div class="row">'+
      '<span class="pill"><i>Squad</i>'+esc(t.squad)+'</span>'+(t.slot?'<span class="pill"><i>Seat</i>#'+esc(t.slot)+'</span>':'')+
      '<span class="pill"><i>Status</i>'+(t.confirmed?'Playing ✓':'Not confirmed')+'</span>'+
      (t.room_id?'<span class="pill room"><i>Room ID</i>'+esc(t.room_id)+'</span><span class="pill room"><i>Password</i>'+esc(t.room_pass||'—')+'</span>':'')+
      '</div></div>').join('');
  }
}catch(e){}
</script>
