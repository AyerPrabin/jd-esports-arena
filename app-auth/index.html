<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07090F">
<meta name="robots" content="noindex">
<title>Back to JD Arena</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#07090F;color:#e8ecf4;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:16px;box-sizing:border-box}
  .b{max-width:360px}
  h1{font-size:20px;margin:0 0 8px;color:#FFC83D}
  p{margin:0 0 20px;color:#9aa3b5}
  a.go{display:inline-block;background:#FFC83D;color:#07090F;font-weight:700;text-decoration:none;padding:14px 28px;border-radius:12px}
</style>
</head>
<body>
<div class="b">
  <h1 id="t">Signed in ✓</h1>
  <p id="m">Going back to the JD Arena app…</p>
  <a class="go" id="go" href="#" hidden>Open JD Arena</a>
</div>
<script>
/* JD Arena app 2.0 Google sign-in (home.js authGoogleSignIn): Google won't sign in inside the app, so it runs
   in a Chrome tab and lands here with the session in the address. Hand it to the app (jdarena://auth, our
   package only) and wipe it from this tab's address. */
(function () {
  var h = location.hash.replace(/^#/, ''), q = new URLSearchParams(location.search);
  history.replaceState(null, '', location.pathname);
  var go = document.getElementById('go');
  if (!/(^|&)access_token=/.test(h)) {
    document.getElementById('t').textContent = 'Sign-in did not finish';
    document.getElementById('m').textContent = (new URLSearchParams(h).get('error_description') || q.get('error_description') || 'Go back to the app and try again.');
    go.href = 'intent://open#Intent;scheme=jdarena;package=uk.co.jdesport.arena;end';
    go.hidden = false;
    return;
  }
  go.href = 'intent://auth?h=' + encodeURIComponent(h) + '#Intent;scheme=jdarena;package=uk.co.jdesport.arena;end';
  go.hidden = false;
  location.href = go.href;
})();
</script>
</body>
</html>
