<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JD Arena">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07090F">
<link rel="icon" type="image/png" href="/favicon-64.png">
<link rel="manifest" href="/manifest.json">
<title>Chat — JD Esports Arena</title>
<meta name="description" content="Chat with your friends, your Clash Squad team and the other captain of your challenge, and ask ZULU, the JD Arena AI.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Geist:wght@300..800&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090F;--panel:#111827;--line:rgba(255,200,80,.14);
  --gold:#FFC83D;--gold-l:#FFDD85;--gold-m:rgba(255,200,80,.42);
  --cream:#FFFFFF;--silver:#A6AFC2;--body:#8A94A8;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--cream);font-family:var(--font-body);line-height:1.5;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
a{color:inherit;text-decoration:none}
header{flex:none;padding:14px 20px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1120px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}
.jdlogo{width:34px;height:34px;border-radius:8px;object-fit:cover;flex:none;display:block}
.brand span{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.25rem;letter-spacing:.02em}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{border:1px solid var(--gold-m);color:var(--gold-l);border-radius:30px;padding:7px 14px;font-size:.78rem;font-weight:600}
.links a:hover{background:rgba(255,200,61,.12)}
main{flex:1;min-height:0;width:100%;max-width:1120px;margin:0 auto;padding:16px 20px 20px}
.cp-signin{max-width:420px;margin:12vh auto 0;padding:28px 24px;text-align:center;border:1px solid var(--line);border-radius:22px;background:var(--panel)}
.cp-signin[hidden]{display:none}
.cp-signin .ic{font-size:2.4rem}
.cp-signin h1{margin:8px 0 6px;font-family:'Barlow Condensed',sans-serif;font-size:1.8rem}
.cp-signin p{margin:0 0 18px;color:var(--body);font-size:.9rem}
.cp-signin a{display:inline-block;padding:11px 22px;border-radius:999px;background:var(--gold);color:#0a0a12;font-weight:800}
@media(max-width:640px){
  header{display:none}
  main{padding:0}
}
</style>
<link rel="stylesheet" href="/ui.css?v=24">
<link rel="stylesheet" href="/broadcast.css?v=5">
</head>
<body class="chat-page">
<header>
  <div class="bar">
    <a class="brand" href="/"><img class="jdlogo" src="/logo.webp" alt="JD Esports Arena" width="34" height="34"><span>JD Esports Arena</span></a>
    <nav class="links" aria-label="Site"><a href="/">Home</a><a href="/challenges/">⚔️ Challenges</a><a href="/leaderboard.html">🏆 Leaderboard</a></nav>
  </div>
</header>
<main id="chat-page">
  <div class="cp-signin" id="cp-signin" hidden>
    <div class="ic" aria-hidden="true">💬</div>
    <h1>Sign in to chat</h1>
    <p>Message your friends, make a squad chat for your Clash Squad team, talk to the other captain of your challenge and ask ZULU, the JD Arena AI.</p>
    <a href="/?signin=1">Sign in</a>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<script>
const sb=(typeof supabase!=='undefined')?supabase.createClient('https://cnoxvqvpmgowdiyrrusv.supabase.co','sb_publishable_5n7uzH5crKrLe8A75K6OVQ_C_di-jil'):null;
// logged out: chat.js shows the sign-in card once it knows (it hides the chat until then)
if(sb)sb.auth.getSession().then(r=>{if(!(r&&r.data&&r.data.session))document.getElementById('cp-signin').hidden=false;});
else document.getElementById('cp-signin').hidden=false;
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('/sw.js',{scope:'/',updateViaCache:'none'}).catch(()=>{});
</script>
<script src="/ui.js?v=24" defer></script>
<script src="/chat.js?v=31" defer></script>
</body>
</html>
